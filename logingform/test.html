<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <title>SOREMED</title>
    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
    background: linear-gradient(to left, #CFFCF0, #FFFFFF);
}

/* Title/Header */
.header img {
    width: 81px;
    height: 53px;
}

.header h1 {
    font-size: 40px;
    color: #3EB596;
    font-family: 'Inter', sans-serif;
    font-weight: 900;
}

.header {
    padding: 16px;
    width: 242px;
    display: flex;
    align-items: center;
    gap: 12px;
}

/* Right Box */
.right-box {
    width: 70%;
    background: #ffffff;
    height: 400px;
    margin-left: 202px;
    padding: 24px 0 0 566px;
    border-radius: 25px;
}

.right-box h2 {
    font: 400 48px 'Montserrat', sans-serif;
    position: relative;
    right: 90px;
    width: 400px;
}

.form-group {
    margin: 28px 0 0 16px;
    width: fit-content;
    display: flex;
    justify-content: center;
}

.form-group input {
    position: relative ;
    right: 90px;
    width: 323px;
    height: 48px;
    padding: 16px;
    background: #88888815;
    border: 1px solid rgba(0, 0, 0, 0.151);
}


.form-group input::placeholder {
    font-size: 12px;
    padding-right: 16px;
}

.checkbox {
    position: relative ;
    right: 90px;
    margin: 12px 0 40px 16px;
}

.checkbox input {
    
    width: 13px;
    height: 13px;
}

.checkbox label {
   
    font-family: 'Inter', sans-serif;
    color: #888;
}

.button1 button {
    padding: 12px 24px;
    border: 2px solid white;
    color: white;
    width: 125px;
    background: #3EB596;
    border-radius: 25px;
    cursor: pointer;
    font-size: 12px;
    margin-left: 40px;
}

/* Left Box */
.left-box {
    position: fixed;
    width: 30%;
    height: 400px;
    z-index: 9999;
    background: #3EB596;
    padding: 8px;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
    transform: translate(202px, 0px);
    border-radius: 25px 121px 80px 20px;
}

.left-box span {
    font-family: 'Inter', sans-serif;
    display: flex;
    font-size: 40px;
    color: #FFFFFF;
    font-weight: 900;
    margin-top: 100px;
    margin-left: 97px;
}

.left-box div {
    padding-top: 16px;
    text-align: center;
}

.left-box p {
    font-family: 'Lato', sans-serif;
    font-weight: 400;
    color: white;
    font-size: 16px;
    padding-top: 4px;
}

.button2 button {
    padding: 12px 24px;
    border: 2px solid white;
    color: white;
    width: 125px;
    background: #3EB596;
    border-radius: 25px;
    cursor: pointer;
    font-size: 12px;
    margin-top: 48px;
}
@keyframes stretchBox {
    0% {
        width: 30%;
    }
    50% {
        width: 100%;
        border-radius: 25px;
    }
    100% {
        width: 30%;
    }
}

.animate-expand {
    animation: stretchBox 2s ease-in-out forwards;
}

.fade-in {
    opacity: 0;
    animation: fadeIn 0.6s ease-in-out forwards;
}

@keyframes fadeIn {
    to {
        opacity: 1;
    }
}.double-input {
    display: flex;
    gap: 16px;
    position: relative;
    right: 90px;
}

    </style>
 <div class="form-content fade-in">

                </div>

                    <input type="text" placeholder="Prenom" style="width: 153px; height: 48px; padding: 16px; background: #88888815; border: 1px solid rgba(0, 0, 0, 0.151);">
                </div>
                <div class="form-group">
                    <input type="text" placeholder="E-mail">
                </div>
                <div class="form-group" style="display: flex; gap: 16px; right: 90px; position: relative;">
                    <input type="text" placeholder="Ville" style="width: 153px; height: 48px; padding: 16px; background: #88888815; border: 1px solid rgba(0, 0, 0, 0.151);">
                    <input type="text" placeholder="N°Tel" style="width: 153px; height: 48px; padding: 16px; background: #88888815; border: 1px solid rgba(0, 0, 0, 0.151);">
                </div>
                <div class="button1" style="margin-top: 24px;">
                    <button class="btn-login">S'inscrire</button>
                </div>
            </div>
        `;
</body>
</html>
