<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panier - SOREMED Interactive</title>
    <!-- Load Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* ======================================= */
        /* === USER'S ORIGINAL CSS (Modified slightly for icons) === */
        /* ======================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* Background from home/product page, but keeping original structure */
            background: linear-gradient(to bottom, #fff3e0, #FFFFFF) no-repeat;
            font-family: 'DM Sans', sans-serif; 
            color: #001219; 
            line-height: 1.6;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* ======================================= */
        /* === UNIFIED HEADER STYLES (FIXED) === */
        /* ======================================= */

        /* Set headers to sticky to ensure they float together */
        .header1, .header2 {
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header2 {
            z-index: 1001;
        }

        /* header1 (Top Green Bar) */
        .header1 {
            width: 100%;
            height: 60px;
            display: flex;
            align-items: center;
            /* Primary Brand Color: #3EB596 */
            background-color: #3EB596; 
        }
        /* Logo and User Image Sizing */
        .header1 img {
            width: 30px;
            height: 30px;
            margin: 0 15px;
            /* Adjustments for better placement if using actual images */
        }
        .header1 .user-icon {
            margin-right: 20px; 
            margin-left: 0; 
        }

        /* Welcome Text (Pushes to the right) */
        .header1 p {
            flex-grow: 1; /* Allows the text to take up the space */
            text-align: right;
            font-size: 18px;
            color: #ffffff;
            font-weight: 400;
            margin-right: 10px; /* Space between text and user icon */
        }
        

        /* header2 (Main Black Bar) */
        .header2 {
            width: 100%;
            min-height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            /* Secondary Brand Color: #000000 */
            background-color: #000000;
            padding: 0 20px;
        }

        /* Menu Icon, Cart Icon, and Search Icons */
        .header2 img {
            width: 30px;
            height: 30px;
            margin-left: 0;
            fill: white;
        }
        .header2 .menu-icon {
            width: 40px;
            height: 40px;
        }
        .header2 .cart-icon {
            width: 30px;
            height: 30px;
            margin-right: 0;
            margin-left: 20px; /* Space from search bar */
        }
        .search-icon, .qrcode-icon {
            width: 20px;
            height: 20px;
            fill: #9aa0a6;
        }
        .qrcode-icon {
            fill: #5f6368;
        }

        /* Menu Links */
        .menu-items {
            display: flex;
            gap: 30px;
            margin-left: 20px;
            margin-right: 20px;
            flex-shrink: 0; 
        }
        .menu-items span {
            position: relative;
            font-size: 19px;
            color: #ffffff;
            font-weight: 400;
            padding-top: 5px;
            display: inline-block;
            transition: color 0.1s ease;
        }
        .menu-items span::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            height: 2px;
            width: 0%;
            background: #3EB596;
            box-shadow: 0 0 20px #3EB596, 0 0 50px #3EB596;
            transition: width 0.1s ease-in-out;
            z-index: 1;
        }
        .menu-items span:hover::before {
            width: 100%;
        }
        .menu-items span:hover {
            color: #3EB596;
            cursor: pointer;
        }

        /* Search Bar */
        .search-container {
            flex-grow: 1; /* Allows search bar to take up most of the middle space */
            max-width: 600px;
            margin: 0 20px 0 auto;
        }
        .search-bar {
            display: flex;
            align-items: center;
            background: white;
            padding: 0 10px;
            height: 40px;
            border-radius: 4px;
        }
        .search-input {
            flex: 1;
            border: none;
            outline: none;
            font-size: 16px;
            padding: 0 8px;
            height: 100%;
        }
        .icon-button {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
        }


        /* ======================================= */
        /* === ORIGINAL CART BODY STYLES === */
        /* ======================================= */

        /* Breadcrumb */
        .breadcrumb {
            padding: 1rem 0;
            background: white;
            border-bottom: 1px solid #e2e8f0;
        }

        .breadcrumb-link {
            color: #3EB596; 
            text-decoration: none;
            font-size: 0.875rem;
        }

        .breadcrumb-separator {
            margin: 0 0.5rem;
            color: #718096;
        }

        .breadcrumb-current {
            color: #222; 
            font-size: 0.875rem;
        }

        /* Main Content */
        .main-content {
            padding: 2rem 0;
        }

        .content-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        /* Cart Items */
        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .cart-item {
            background: #fff7ef;
            border: 1px solid #b5e3f9;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            gap: 1rem;
            min-height: 12rem; /* Ensure enough height for the image/content */
        }

        .item-image {
            position: relative;
            flex-shrink: 0;
        }

        .item-image img {
            width: 8rem;
            height: 8rem;
            object-fit: contain;
            background: #f7fafc;
            border-radius: 0.375rem;
        }

        .special-badge {
            position: absolute;
            top: 0.5rem;
            left: 0.5rem;
            background: #ef5350; 
            color: white;
            padding: 0.25rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .item-info {
            flex: 1;
        }

        .item-title {
            font-size: 1.125rem;
            font-weight: 600;
            color: #222; 
            margin-bottom: 0.25rem;
        }

        .item-divider {
            height: 0.25rem;
            width: 5rem;
            background: #3EB596; 
            margin-bottom: 0.5rem;
        }

        .item-description {
            font-size: 0.875rem;
            color: #718096;
            margin-bottom: 0.5rem;
        }

        .item-reference {
            font-size: 0.75rem;
            color: #718096;
        }

        .item-actions {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .action-buttons {
            display: flex;
            gap: 0.5rem;
        }

        /* Make touch targets larger for phones */
        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.75rem; /* Increased padding for easy tapping */
            min-width: 44px; /* Minimum recommended touch target size */
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.375rem;
            transition: background-color 0.2s;
            color: #718096;
        }

        .action-btn:hover {
            background: #f7fafc;
        }

        .favorite-btn[data-favorite="true"] svg {
            fill: #FEBA17; 
            stroke: #FEBA17;
        }

        .remove-btn:hover {
            color: #ef5350;
        }

        .stock-status {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
        }

        .stock-dot {
            width: 0.5rem;
            height: 0.5rem;
            background: #66bb6a;
            border-radius: 50%;
        }

        .stock-text {
            color: #66bb6a;
            font-weight: 500;
        }

        .item-price {
            text-align: right;
        }

        .price-row {
            font-size: 0.875rem;
            margin-bottom: 0.25rem;
        }

        .price-amount {
            font-weight: 600;
        }

        .price-label {
            color: #718096;
            margin-left: 0.5rem;
        }

        .price-row.secondary .price-amount {
            color: #001219;
            font-weight: 600;
            font-size: 1rem;
        }

        .quantity-control {
            display: flex;
            align-items: center;
            border: 1px solid #e2e8f0;
            border-radius: 0.375rem;
            overflow: hidden;
        }

        /* Make touch targets larger for phones */
        .qty-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 0.75rem; /* Increased padding for easy tapping */
            min-width: 44px;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 2.5rem;
            height: 2.5rem;
            transition: background-color 0.2s;
        }

        .qty-btn:hover {
            background: #f7fafc; 
            color: #3EB596;
        }

        .minus-btn {
            border-right: 1px solid #e2e8f0;
        }

        .plus-btn {
            border-left: 1px solid #e2e8f0;
        }

        .qty-value {
            width: 3rem;
            text-align: center;
            font-size: 0.875rem;
            font-weight: 500;
        }

        /* Order Summary */
        .order-summary {
            background: #fff7ef;
            border: 1px solid #b5e3f9;
            border-radius: 0.5rem;
            padding: 1.5rem;
            position: sticky;
            top: 130px; /* Adjusted sticky top position */
            height: fit-content;
        }

        .summary-title {
            font-size: 1.25rem;
            font-weight: bold;
            color: #222; 
            margin-bottom: 1.5rem;
        }

        .summary-items {
            margin-bottom: 1.5rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            margin-bottom: 0.75rem;
        }

        .summary-name {
            color: #718096;
        }

        .summary-price {
            font-weight: 500;
        }

        .summary-totals {
            border-top: 1px solid #e2e8f0;
            padding-top: 1rem;
            margin-bottom: 1.5rem;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .total-label {
            font-weight: 600;
            color: #222; 
        }

        .total-value {
            text-align: right;
        }

        .total-amount {
            font-weight: bold;
            font-size: 1.125rem;
            color: #001219; 
        }

        .discount {
            display: block;
            font-size: 0.875rem;
            color: #66bb6a; 
        }

        .checkout-btn {
            width: 100%;
            background: #28a57e; 
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .checkout-btn:hover {
            background: #1e8764;
        }

        /* ======================================= */
        /* === RESPONSIVE STYLES (CLEANED) === */
        /* ======================================= */

        /* Large tablets and small laptops */
        @media (min-width: 1024px) {
            .content-grid {
                grid-template-columns: 1fr 400px;
            }
        }

        /* Tablets (840px and below) */
        @media (max-width: 840px) {
            .header2 {
                /* Force layout to stack vertically */
                flex-direction: column;
                align-items: flex-start;
                padding: 10px 20px;
                height: auto;
            }

            .header2 .menu-icon {
                margin-bottom: 5px;
            }

            .menu-items {
                /* Full width for menu, stays at the top */
                width: 100%;
                margin: 5px 0 10px 0;
                gap: 20px;
                overflow-x: auto;
                white-space: nowrap;
                justify-content: flex-start;
            }

            .search-container {
                /* Search bar now takes almost full width, below the menu */
                width: 100%;
                max-width: 100%;
                margin: 10px 0; 
                order: 3; /* Move search to the bottom of the column */
            }
            
            .header2 .cart-icon {
                /* Move cart icon up to be next to the menu icon/brand area */
                position: absolute;
                top: 10px;
                right: 20px;
                margin: 0;
            }
            
            /* Original cart item responsive rules */
            .cart-item {
                flex-direction: column;
            }
            .item-actions {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                width: 100%;
                flex-wrap: wrap; 
            }
        }

        /* Phones (480px and below) */
        @media (max-width: 480px) {
            .header1 p {
                font-size: 14px;
                margin-right: 50px;
            }
            
            .menu-items {
                /* Center the menu items on smaller screens */
                justify-content: center;
                gap: 10px;
               
                font-size: 13px;
            }
            .menu-items span{
   
                 padding-right: 17px; 
                 padding-left: 17px;
                 padding-bottom: 5px;
                
            }

            /* Reverting item actions to a cleaner column layout for very small screens */
            .item-actions {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }
            .action-buttons {
                order: 1;
                align-self: flex-end; /* Keep favorite/remove buttons on the right */
            }
            .item-price {
                order: 2;
                width: 100%;
            }
            .stock-status {
                order: 3;
            }
            .quantity-control {
                order: 4;
            }
        }
    </style>
</head>
<body>
    
    <div class="header1">
        <!-- Re-added original image sources for the logo and user icon -->
        <img src="img/SOREMED icon.png" alt="soremed logo">
        <p>Bienvenue, [Nom de l'utilisateur] !</p>
        <img src="img/user.png" alt="profile" class="p2 user-icon">
    </div>
    
    <div class="header2">
        <!-- Re-added original image sources for the menu and cart icon -->
        <img src="img/burger-bar.png" alt="menu" class="menu-icon">
        <div class="menu-items">
            <span>Accueil</span>
            <span>Nouveau</span>

        <div class="search-container">
            <div class="search-bar">

        <img src="img/shopping-cart.png" alt="cart" class="cart-icon">

    <div class="breadcrumb">
        <div class="container">
            <a href="#" class="breadcrumb-link">Accueil</a>
            <span class="breadcrumb-separator">/</span>

        </div>
    </div>

    <main class="main-content">
        <div class="container">
            <div class="content-grid">
                <!-- Cart items will be dynamically rendered here -->
                <div id="cart-items-container" class="cart-items">
                    <!-- Dynamic content injection -->
                </div>

                <div class="order-summary">
                    <h2 class="summary-title">Résumé de votre commande</h2>

                    <!-- Summary items will be dynamically rendered here -->

                        <!-- Dynamic content injection -->
                    </div>

                    <div class="summary-totals">
                        <div class="total-row">
                            <span class="total-label">Total de la commande PV</span>

                                <span id="total-pv" class="total-amount">MAD 0.00</span>

                        </div>
                        <div class="total-row">
                            <span class="total-label">Total de la commande PPH</span>

  // ... (The rest of your HTML and CSS remains the same) ...

<script>
    // --- CART DATA SIMULATION (The 'Backend' Data) ---
    let cartData = [
        {
            id: 1,
            title: "DOLIPRANE TABS 1000MG BT 8",
            description: "Médicament à base de paracétamol indiqué...",
            reference: "3400937435888",
            pricePPH: 15.00, 
            pricePV: 20.00, 
            quantity: 1,
            inStock: true,
            isSpecialOffer: true,
            isFavorite: false,
            imageUrl: "https://placehold.co/128x128/f7fafc/3EB596?text=Doliprane"
        },
        {
            id: 2,
            title: "AMOXICILLINE 500MG/5ML POUDRE P/SUSP BUV FL",
            description: "Antibiotique de la famille des pénicillines...",
            reference: "4500123456789",
            pricePPH: 45.50,
            pricePV: 60.00,
            quantity: 2,
            inStock: true,
            isSpecialOffer: false,
            isFavorite: true,
            imageUrl: "https://placehold.co/128x128/f7fafc/3EB596?text=Amox"
        },
        {
            id: 3,
            title: "CRÈME SOLAIRE SPF 50+ 50ML",
            description: "Très haute protection solaire pour peaux sensibles.",
            reference: "9988776655443",
            pricePPH: 120.00,
            pricePV: 150.00,
            quantity: 1,
            inStock: false,
            isSpecialOffer: false,
            isFavorite: false,
            imageUrl: "https://placehold.co/128x128/f7fafc/3EB596?text=Crème"
        }
    ];

    // --- CORE INTERACTION FUNCTIONS (The 'Backend' Logic) ---

    /**
     * Finds a cart item by its ID.
     * @param {number} id - The ID of the item.
     * @returns {object|null} The item object or null.
     */
    function findItem(id) {
        return cartData.find(item => item.id === id);
    }

    /**
     * Updates the quantity of a cart item, updates the DOM *locally*, and re-renders the summary.
     * @param {number} id - The item ID.
     * @param {number} delta - The change in quantity (-1 or +1).
     * @param {HTMLElement} btnElement - The button element clicked to find the DOM context.
     */
    function updateQuantity(id, delta, btnElement) {
        const item = findItem(id);
        if (item) {
            const newQty = item.quantity + delta;
            
            if (newQty >= 1) {
                item.quantity = newQty;

                // 1. **LOCAL DOM UPDATE (The FIX):** // Find the closest cart item container
                const cartItemElement = btnElement.closest('.cart-item');
                // Find the quantity display element within that item
                const qtyValueElement = cartItemElement ? cartItemElement.querySelector('.qty-value') : null;
                // Find the price elements within that item
                const pphPriceElement = cartItemElement ? cartItemElement.querySelector('.price-row:not(.secondary) .price-amount') : null;
                const pvPriceElement = cartItemElement ? cartItemElement.querySelector('.price-row.secondary .price-amount') : null;
                
                if (qtyValueElement) {
                    qtyValueElement.textContent = item.quantity;
                }
                
                if (pphPriceElement) {
                    pphPriceElement.textContent = `MAD ${(item.pricePPH * item.quantity).toFixed(2)}`;
                }
                
                if (pvPriceElement) {
                    pvPriceElement.textContent = `MAD ${(item.pricePV * item.quantity).toFixed(2)}`;
                }

                // 2. **SUMMARY UPDATE:** // Re-render only the summary, which is less heavy than the whole cart
                updateSummary(); 
            } else if (newQty === 0) {
                // If quantity hits zero, remove the item
                removeItem(id);
            }
        }
    }

    /**
     * Removes an item from the cart data and re-renders.
     * @param {number} id - The item ID.
     */
    function removeItem(id) {
        const statusBox = document.getElementById('status-message');
        if (statusBox) {
            statusBox.textContent = `Produit ID ${id} retiré du panier.`;
            statusBox.className = 'mb-4 text-center text-sm font-medium text-red-600 bg-red-50 p-2 rounded';
            setTimeout(() => statusBox.textContent = '', 3000);
        } else {
            console.log(`Product ID ${id} removed.`);
        }

        cartData = cartData.filter(item => item.id !== id);
        renderCart(); // Full re-render is fine for removal
    }
    
    /**
     * Toggles the favorite status of an item.
     * @param {number} id - The item ID.
     * @param {HTMLElement} buttonElement - The favorite button element.
     */
    function toggleFavorite(id, buttonElement) {
        const item = findItem(id);
        if (item) {
            item.isFavorite = !item.isFavorite;
            
            // Update the button element immediately for responsiveness
            buttonElement.setAttribute('data-favorite', item.isFavorite ? 'true' : 'false');
            
            // Update SVG fill based on state
            const svgPath = buttonElement.querySelector('svg');
            if(svgPath) {
                svgPath.setAttribute('fill', item.isFavorite ? '#FEBA17' : 'none');
            }
        }
    }

    /**
     * Calculates the total prices and updates the summary section.
     */
    function updateSummary() {
        const totalPPH = cartData.reduce((sum, item) => sum + (item.pricePPH * item.quantity), 0);
        const totalPV = cartData.reduce((sum, item) => sum + (item.pricePV * item.quantity), 0);

        // Ensure these elements exist before trying to set textContent
        const totalPphEl = document.getElementById('total-pph');
        const totalPvEl = document.getElementById('total-pv');
        if (totalPphEl) totalPphEl.textContent = `MAD ${totalPPH.toFixed(2)}`;
        if (totalPvEl) totalPvEl.textContent = `MAD ${totalPV.toFixed(2)}`;

        const summaryItemsContainer = document.getElementById('summary-items');
        if (summaryItemsContainer) {
            summaryItemsContainer.innerHTML = cartData.map(item => `
                <div class="summary-item">
                    <span class="summary-name">${item.title} (x${item.quantity})</span>
                    <span class="summary-price">MAD ${(item.pricePPH * item.quantity).toFixed(2)}</span>
                </div>
            `).join('');
        }
        
        // Add a status message container at the top of the summary for visual feedback
        if (!document.getElementById('status-message')) {
            const statusDiv = document.createElement('div');
            statusDiv.id = 'status-message';
            statusDiv.className = 'mb-4 text-center text-sm font-medium';
            const summaryEl = document.querySelector('.order-summary');
            if(summaryEl) summaryEl.prepend(statusDiv);
        }
    }

    /**
     * Renders the cart items and summary based on the current cartData.
     * This function should only be called for initial load or full cart changes (like item removal).
     */
    function renderCart() {
        const container = document.getElementById('cart-items-container');
        if (!container) return;

        if (cartData.length === 0) {
            container.innerHTML = '<div class="p-6 text-center text-gray-500 bg-white rounded-lg shadow">Votre panier est vide.</div>';
            updateSummary();
            return;
        }

        container.innerHTML = cartData.map(item => `
            <div class="cart-item" data-id="${item.id}">
                <div class="item-image">
                    <img src="${item.imageUrl}" alt="${item.title}">
                    ${item.isSpecialOffer ? '<span class="special-badge">OFFRE SPECIAL</span>' : ''}
                </div>

                <div class="item-info">
                    <h3 class="item-title">${item.title}</h3>
                    <div class="item-divider"></div>
                    <p class="item-description">${item.description}</p>
                    <p class="item-reference">Réf. : ${item.reference}</p>
                </div>

                <div class="item-actions">
                    
                    <div class="item-price">
                        <div class="price-row">
                            <span class="price-amount">MAD ${(item.pricePPH * item.quantity).toFixed(2)}</span>
                            <span class="price-label">PPH</span>
                        </div>
                        <div class="price-row secondary">
                            <span class="price-amount">MAD ${(item.pricePV * item.quantity).toFixed(2)}</span>
                            <span class="price-label">PV</span>
                        </div>
                    </div>

                    <div class="stock-status">
                        <span class="stock-dot" style="background: ${item.inStock ? '#66bb6a' : '#ef5350'};"></span>
                        <span class="stock-text" style="color: ${item.inStock ? '#66bb6a' : '#ef5350'};">${item.inStock ? 'En stock' : 'Rupture'}</span>
                    </div>

                    <div class="quantity-control">
                        <button class="qty-btn minus-btn" data-action="minus" data-id="${item.id}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <span class="qty-value">${item.quantity}</span>
                        <button class="qty-btn plus-btn" data-action="plus" data-id="${item.id}">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="action-buttons">
                        <button class="action-btn favorite-btn" data-favorite="${item.isFavorite}" data-id="${item.id}">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="${item.isFavorite ? '#FEBA17' : 'none'}" stroke="currentColor" stroke-width="2">
                                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
                            </svg>
                        </button>
                        <button class="action-btn remove-btn" data-id="${item.id}">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                </div>
            </div>
        `).join('');

        // After rendering the structure, update the summary
        updateSummary();
        // Since we re-rendered, we must re-attach the delegated event listeners
        attachEventListeners(); 
    }

    /**
     * Attaches event listeners to the dynamically created buttons.
     * This function must be idempotent (safe to run multiple times).
     */
    function attachEventListeners() {
        const cartContainer = document.getElementById('cart-items-container');
        const checkoutButton = document.querySelector('.checkout-btn');

        // Prevent multiple listeners if renderCart is called more than once
        cartContainer.removeEventListener('click', handleCartAction);
        cartContainer.addEventListener('click', handleCartAction);
        
        // Prevent multiple listeners on checkout button
        checkoutButton.removeEventListener('click', handleCheckout);
        checkoutButton.addEventListener('click', handleCheckout);
    }
    
    /**
     * Delegated event handler for all cart item actions.
     */
    function handleCartAction(event) {
        const target = event.target.closest('button');
        if (!target) return;

        const id = parseInt(target.getAttribute('data-id'));
        if (isNaN(id)) return;

        if (target.classList.contains('plus-btn')) {
            updateQuantity(id, 1, target);
        } else if (target.classList.contains('minus-btn')) {
            updateQuantity(id, -1, target);
        } else if (target.classList.contains('remove-btn')) {
            removeItem(id);
        } else if (target.classList.contains('favorite-btn')) {
            toggleFavorite(id, target);
        }
    }
    
    /**
     * Event handler for the checkout button.
     */
    function handleCheckout() {
        console.log('Action de paiement déclenchée. Total PPH:', document.getElementById('total-pph').textContent);
        const statusBox = document.getElementById('status-message');
        if (statusBox) {
            statusBox.textContent = 'Paiement simulé! Prêt à passer à l\'étape suivante.';
            statusBox.className = 'mb-4 text-center text-sm font-medium text-green-600 bg-green-50 p-2 rounded';
            setTimeout(() => statusBox.textContent = '', 3000);
        }
    }

    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', renderCart);
</script>
</body>
